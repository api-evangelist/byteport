aid: byteport
name: Byteport
description: Byteport is a San Francisco-based file transfer acceleration company (Y Combinator
  W2026) that moves large datasets across the internet using DART (Dynamic Accelerated Record
  Transfer), a proprietary protocol the company reports as typically 10x faster than TCP and
  up to 1000-1500x faster over unreliable cellular or satellite links. The Byteport API lets
  developers copy, move, pull, share, and list files across connected storage providers such
  as Amazon S3, Google Drive, Dropbox, and Box at scales from 1GB to 100TB with zero network
  configuration, targeting robotics, satellite, AI/ML, SaaS data-distribution, and defense
  workloads.
